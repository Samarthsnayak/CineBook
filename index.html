<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineBook – Online Movie Ticket Booking System</title>
    <meta name="description" content="Book movie tickets online across top cinemas with interactive seating layouts, instant QR tickets, and seamless showtime discovery." />
    <meta property="og:title" content="CineBook – Online Movie Ticket Booking System" />
    <meta property="og:description" content="Book movie tickets online across top cinemas with interactive seating layouts, instant QR tickets, and seamless showtime discovery." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cinebook_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FC] text-slate-900 dark:bg-[#080A10] dark:text-slate-100 antialiased selection:bg-rose-600/30 selection:text-rose-900 dark:selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
