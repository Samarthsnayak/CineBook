<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/navbar :: head('Theatres')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 fw-bold text-white mb-1">Partner Theatres</h1>
            <p class="text-secondary small mb-0">Filter luxury cinemas and multiplex screens by city</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/theatres}" class="btn btn-sm" th:classappend="${selectedCity == null} ? 'btn-cine' : 'btn-outline-secondary'">All Cities</a>
            <a th:each="c : ${cities}" th:href="@{/theatres(city=${c})}" th:text="${c}"
               class="btn btn-sm" th:classappend="${c == selectedCity} ? 'btn-cine' : 'btn-outline-secondary'"></a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6" th:each="theatre : ${theatres}">
            <div class="cb-card p-4 h-100">
                <div class="small text-danger fw-semibold mb-1" th:text="${theatre.city}"></div>
                <h2 class="h5 fw-bold text-white mb-2" th:text="${theatre.name}"></h2>
                <p class="small text-secondary mb-2" th:text="${theatre.address}"></p>
                <p class="small text-secondary mb-3" th:text="${theatre.amenities}"></p>
                <a th:href="@{/movies}" class="btn btn-outline-light btn-sm">Browse Movies</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/navbar :: footer}"></footer>
</body>
</html>
