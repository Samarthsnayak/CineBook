<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | CineBook'">CineBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cinebook.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark cb-navbar sticky-top no-print py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-white d-flex align-items-center gap-2" th:href="@{/}">
            <span style="color:#e11d48;">●</span> CineBook
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#cineNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="cineNav">
            <ul class="navbar-nav mx-auto gap-lg-3">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/movies}">Movies</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/theatres}">Theatres</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bookings/my}">My Bookings</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-danger fw-semibold" th:href="@{/admin}">Admin Dashboard</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3">Login</a>
                    <a th:href="@{/register}" class="btn btn-cine btn-sm px-3">Register</a>
                </div>
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                    <span class="small text-secondary" sec:authentication="name"></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="border-top border-secondary border-opacity-25 py-4 mt-5 no-print">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-secondary small">
        <span>© 2026 CineBook – Online Movie Ticket Booking System (Java Spring Boot + MySQL)</span>
        <span>Crafted for seamless cinema discovery & instant digital tickets</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
