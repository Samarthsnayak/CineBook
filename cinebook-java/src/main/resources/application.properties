# ============================================================================
# CineBook - Spring Boot Application Configuration
# ============================================================================

spring.application.name=CineBook
server.port=8080

# MySQL Database Configuration
# Update username & password to match your local MySQL Server installation
spring.datasource.url=jdbc:mysql://localhost:3306/cinebook_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Persistent Session Cookie Configuration
server.servlet.session.timeout=24h
server.servlet.session.cookie.name=CINEBOOK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=86400s
server.servlet.session.cookie.path=/

# Optional TMDB API Integration (Backend Only - Never expose to frontend)
# Set TMDB_API_KEY environment variable before starting Spring Boot
tmdb.api.key=${TMDB_API_KEY:}
tmdb.api.base-url=https://api.themoviedb.org/3

# Logging
logging.level.com.cinebook=INFO
logging.level.org.springframework.security=WARN
